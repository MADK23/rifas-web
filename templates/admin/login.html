<!DOCTYPE html>
<html>

<head>

    <title>Login Admin</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1>Panel de Administración</h1>

    <form action="/admin/login" method="POST">

        <input
            type="text"
            name="usuario"
            placeholder="Usuario"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Contraseña"
            required
        >

        <button>

            Iniciar sesión

        </button>

    </form>

</div>

</body>

</html>
